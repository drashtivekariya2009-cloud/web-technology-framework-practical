<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickShop API Product Explorer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #fff8f1;
      color: #2a1a0e;
      line-height: 1.5;
    }

    header {
      background: #2a1a0e;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #ea580c;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .brand span {
      color: #fdba74;
    }

    .tag {
      font-size: 12px;
      letter-spacing: .08em;
      color: #fdba74;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    h1 {
      font-size: 34px;
      margin: 4px 0 24px;
    }

    .lead {
      color: #7c5a40;
      margin: 0 0 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: #ffffff;
      border: 1px solid #f6dfc8;
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .stat .ico {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #ffedd5;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .stat small {
      color: #7c5a40;
      display: block;
    }

    .stat strong {
      font-size: 24px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #f6dfc8;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .panel .sub {
      color: #7c5a40;
      margin: 0 0 18px;
      font-size: 14px;
    }

    .head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pill {
      background: #ffedd5;
      color: #9a3412;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #7c5a40;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #f6dfc8;
      border-radius: 10px;
      font: inherit;
      color: #2a1a0e;
      background: #fffcf8;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible {
      outline: 2px solid #ea580c;
      outline-offset: 1px;
      border-color: #ea580c;
    }

    .row {
      display: grid;
      gap: 14px;
      margin-bottom: 14px;
    }

    .row.c4 {
      grid-template-columns: 1.2fr 1fr auto;
      align-items: end;
    }

    .row.c2 {
      grid-template-columns: 1fr 1fr;
    }

    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      cursor: pointer;
      background: #ea580c;
      color: #fff;
    }

    button:hover {
      background: #9a3412;
    }

    button.ghost {
      background: #ffedd5;
      color: #9a3412;
    }

    button.ghost:hover {
      background: #fed7aa;
    }

    button.warn {
      background: #fef3c7;
      color: #b45309;
    }

    button.warn:hover {
      background: #fde68a;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #message {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    #message.ok {
      display: block;
      background: #dcfce7;
      color: #15803d;
    }

    #message.err {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .item {
      border: 1px solid #f6dfc8;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .item .img {
      background: #ffedd5;
      height: 150px;
      display: grid;
      place-items: center;
    }

    .item img {
      max-height: 140px;
      max-width: 100%;
      object-fit: contain;
    }

    .item .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .item h3 {
      font-size: 15px;
      margin: 0;
    }

    .item p {
      margin: 0;
      font-size: 13px;
      color: #7c5a40;
    }

    .cat {
      align-self: flex-start;
      background: #ffedd5;
      color: #9a3412;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .cat.new {
      background: #dcfce7;
      color: #15803d;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      font-size: 14px;
    }

    .meta b {
      font-size: 16px;
    }

    #preview {
      display: block;
      margin-top: 10px;
      max-height: 140px;
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid #f6dfc8;
    }

    #preview[hidden] {
      display: none;
    }

    .empty {
      color: #7c5a40;
      padding: 24px;
      text-align: center;
      border: 1px dashed #f6dfc8;
      border-radius: 12px;
    }

    pre {
      background: #2a1a0e;
      color: #ffedd5;
      padding: 14px 16px;
      border-radius: 12px;
      overflow: auto;
      max-height: 260px;
      font-size: 12.5px;
      margin: 0;
    }

    .log-line {
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .code {
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
    }

    .code.good {
      background: #dcfce7;
      color: #15803d;
    }

    .code.bad {
      background: #fee2e2;
      color: #b91c1c;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .two h4 {
      margin: 0 0 6px;
      font-size: 13px;
      color: #7c5a40;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      color: #7c5a40;
      font-size: 12px;
      padding: 8px 10px;
      border-bottom: 1px solid #f6dfc8;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #f6dfc8;
      vertical-align: top;
    }

    td code {
      background: #ffedd5;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12.5px;
    }

    .wrap {
      overflow-x: auto;
    }

    footer {
      background: #2a1a0e;
      color: #fdba74;
      font-size: 12px;
      letter-spacing: .05em;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 760px) {

      .stats,
      .row.c4,
      .row.c2,
      .two {
        grid-template-columns: 1fr;
      }

      header,
      footer {
        padding: 14px 18px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <div class="logo">Q</div>
      <div><b>QuickShop</b> <span>/ API Explorer</span></div>
    </div>
    <div class="tag">REST + JSON WORKSPACE</div>
  </header>

  <main>
    <h1>Product explorer</h1>

    <section class="stats">
      <div class="stat">
        <div class="ico">📦</div>
        <div><small>Products shown</small><strong id="statCount">0</strong></div>
      </div>
      <div class="stat">
        <div class="ico">₹</div>
        <div><small>Average price</small><strong id="statAvg">₹0</strong></div>
      </div>
    </section>

    <div id="message" role="status"></div>

    <!-- Fetch (GET) -->
    <section class="panel">
      <div class="head-row">
        <div>
          <h2>Fetch products</h2>
        </div>
      </div>
      <div class="row c4">
        <div>
          <label for="search">Search products</label>
          <input id="search" type="text" placeholder="e.g. phone, laptop, watch">
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">All categories</option>
          </select>
        </div>
        <button id="fetchBtn">Fetch</button>
      </div>

      <div id="products" class="grid">
        <div class="empty">Loading products…</div>
      </div>
    </section>

    <!-- Add (POST) -->
    <section class="panel">
      <div class="head-row">
        <div>
          <h2>Add a product</h2>
        </div>
      </div>
      <form id="addForm" novalidate>
        <div class="row">
          <div>
            <label for="title">Product name</label>
            <input id="title" type="text" maxlength="80" placeholder="e.g. Wireless Mouse">
          </div>
        </div>
        <div class="row c2">
          <div>
            <label for="newCategory">Category</label>
            <input id="newCategory" type="text" maxlength="40" placeholder="e.g. accessories">
          </div>
          <div>
            <label for="price">Price (₹)</label>
            <input id="price" type="number" step="1" min="0" placeholder="0">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="description">Short description</label>
            <textarea id="description" rows="3" maxlength="200" placeholder="Optional details"></textarea>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="image">Product photo</label>
            <input id="image" type="file" accept="image/*">
            <img id="preview" alt="Selected photo preview" hidden>
          </div>
        </div>
        <div class="btns">
          <button type="submit" id="addBtn">Send product</button>
          <button type="reset" class="ghost">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div>© 2026 QUICKSHOP. ALL RIGHTS RESERVED.</div>
    <div>REST API INTEGRATION SYSTEM</div>
  </footer>

  <script>
    const BASE = 'https://dummyjson.com';
    const USD_TO_INR = 88;   // API prices are in USD, shown in rupees
    const $ = (id) => document.getElementById(id);
    let shown = [];          // products currently on screen
    let added = [];          // products added via POST in this session

    /* ---------- helpers ---------- */
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    function fmt(n) {
      return '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
    }

    function showMessage(text, type) {
      const box = $('message');
      box.textContent = text;
      box.className = type;
      clearTimeout(showMessage.t);
      showMessage.t = setTimeout(() => {box.className = '';}, 5000);
    }

    function statusText(code, data) {
      const apiMsg = data && data.message ? ' (' + data.message + ')' : '';
      if (code === 400) return 'Bad request. The server could not understand the data sent' + apiMsg;
      if (code === 401 || code === 403) return 'Access denied. Check permissions' + apiMsg;
      if (code === 404) return 'Not found. That product or endpoint does not exist' + apiMsg;
      if (code === 429) return 'Too many requests. Wait a moment and try again';
      if (code >= 500) return 'Server error. Try again later' + apiMsg;
      return 'Request failed with status ' + code + apiMsg;
    }

    function writeLog() { }

    /* ---------- one function for every API call ---------- */
    async function api(method, path, body) {
      const url = BASE + path;
      const t0 = performance.now();
      let res;
      try {
        res = await fetch(url, {
          method,
          headers: body ? {'Content-Type': 'application/json'} : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
      } catch (e) {
        writeLog(method, url, 0, Math.round(performance.now() - t0), body, {error: 'Network error'});
        throw new Error('Network error. Check your internet connection and try again.');
      }
      const ms = Math.round(performance.now() - t0);

      let data = null;
      try {data = await res.json();} catch (e) { /* not JSON */}

      writeLog(method, url, res.status, ms, body, data);
      if (!res.ok) throw new Error(statusText(res.status, data));
      if (data === null) throw new Error('The server sent a response that is not valid JSON.');
      return data;
    }

    /* ---------- render ---------- */
    function render(list) {
      shown = list;
      const box = $('products');
      if (!list.length) {
        box.innerHTML = '<div class="empty">No products found. Try another search or category.</div>';
      } else {
        box.innerHTML = list.map((p, i) => `
      <article class="item">
        <div class="img">${p.thumbnail ? `<img src="${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy">` : '🛍️'}</div>
        <div class="body">
          <span class="cat ${p._new ? 'new' : ''}">${esc(p._new ? 'Added · ' + p.category : p.category)}</span>
          <h3>${esc(p.title)}</h3>
          <p>${esc((p.description || 'No description').slice(0, 70))}${(p.description || '').length > 70 ? '…' : ''}</p>
          <div class="meta"><b>${fmt(p.price)}</b></div>
        </div>
      </article>`).join('');
      }
      const total = list.reduce((s, p) => s + Number(p.price || 0), 0);
      $('statCount').textContent = list.length;
      $('statAvg').textContent = fmt(list.length ? total / list.length : 0);
    }

    /* ---------- GET: products ---------- */
    async function loadProducts() {
      const q = $('search').value.trim();
      const cat = $('category').value;
      let path = null;   // null = default mixed list
      if (q) path = '/products/search?q=' + encodeURIComponent(q) + '&limit=8';
      else if (cat) path = '/products/category/' + encodeURIComponent(cat) + '?limit=8';

      $('fetchBtn').disabled = true;
      $('products').innerHTML = '<div class="empty">Loading products…</div>';
      try {
        let data;
        if (path) {
          data = await api('GET', path);
        } else {
          const cats = ['mens-watches', 'laptops', 'beauty', 'smartphones'];
          const parts = await Promise.all(cats.map(c => api('GET', '/products/category/' + c + '?limit=1')));
          data = {products: parts.flatMap(d => d.products || [])};
        }
        if (!Array.isArray(data.products)) throw new Error('Unexpected JSON structure: "products" list is missing.');
        const inr = data.products.map(p => ({...p, price: Math.round(p.price * USD_TO_INR)}));
        render([...(q || cat ? [] : added), ...inr]);
        showMessage('Loaded ' + data.products.length + ' products from the API.', 'ok');
      } catch (e) {
        $('products').innerHTML = '<div class="empty">Could not load products.</div>';
        showMessage(e.message, 'err');
      } finally {
        $('fetchBtn').disabled = false;
      }
    }

    /* ---------- GET: categories ---------- */
    async function loadCategories() {
      try {
        const data = await api('GET', '/products/categories');
        $('category').innerHTML = '<option value="">All categories</option>' +
          data.slice(0, 30).map(c => {
            const slug = typeof c === 'string' ? c : c.slug;
            const name = typeof c === 'string' ? c : c.name;
            return `<option value="${esc(slug)}">${esc(name)}</option>`;
          }).join('');
      } catch (e) { /* menu stays on "All categories" */}
    }

    /* ---------- photo preview ---------- */
    function readImage(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('Could not read the selected photo.'));
        r.readAsDataURL(file);
      });
    }

    $('image').addEventListener('change', async () => {
      const file = $('image').files[0];
      const img = $('preview');
      if (!file) {img.hidden = true; return;}
      if (!file.type.startsWith('image/')) {$('image').value = ''; img.hidden = true; return showMessage('Please choose an image file.', 'err');}
      if (file.size > 2 * 1024 * 1024) {$('image').value = ''; img.hidden = true; return showMessage('Photo must be smaller than 2 MB.', 'err');}
      img.src = await readImage(file);
      img.hidden = false;
    });
    $('addForm').addEventListener('reset', () => {$('preview').hidden = true;});

    /* ---------- POST: add product ---------- */
    async function addProduct(ev) {
      ev.preventDefault();
      const title = $('title').value.trim();
      const category = $('newCategory').value.trim();
      const priceRaw = $('price').value;
      const description = $('description').value.trim();
      const photo = $('image').files[0];
      const price = parseFloat(priceRaw);

      if (title.length < 3) return showMessage('Product name must be at least 3 characters.', 'err');
      if (!category) return showMessage('Please enter a category.', 'err');
      if (priceRaw === '' || isNaN(price) || price <= 0) return showMessage('Price must be a number greater than 0.', 'err');

      $('addBtn').disabled = true;
      try {
        const thumbnail = photo ? await readImage(photo) : '';
        const data = await api('POST', '/products/add', {title, category, price, description, image: photo ? photo.name : ''});
        // the API only simulates saving, so we keep the returned record (and photo) in the page
        added.unshift({...data, title, category, price, description, thumbnail, _new: true});
        render([...added, ...shown.filter(p => !p._new)]);
        $('addForm').reset();
        showMessage('Product added. The API returned ID ' + data.id + '.', 'ok');
      } catch (e) {
        showMessage(e.message, 'err');
      } finally {
        $('addBtn').disabled = false;
      }
    }

    /* ---------- events ---------- */
    $('fetchBtn').addEventListener('click', loadProducts);
    $('addForm').addEventListener('submit', addProduct);
    $('search').addEventListener('keydown', e => {if (e.key === 'Enter') loadProducts();});
    $('category').addEventListener('change', () => {$('search').value = ''; loadProducts();});

    loadCategories();
    loadProducts();

  </script>
</body>

</html>
